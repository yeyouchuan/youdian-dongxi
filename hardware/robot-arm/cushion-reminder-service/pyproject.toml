[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cushion-reminder-service"
version = "0.1.0"
description = "MQTT ingestion and robot reminder workflow for the SmartCushion/A1Z demo"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116,<1",
  "openai>=2.26,<3",
  "paho-mqtt>=2.1,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "ruff>=0.14,<1",
]

[project.scripts]
cushion-simulator = "cushion_reminder.simulator:main"
cushion-web = "cushion_reminder.web:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cushion_reminder"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
